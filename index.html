<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Chaser</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#392064,#100820 65%,#03020b);color:white;font-family:Arial,sans-serif;text-align:center;min-height:100vh}
header{padding:15px}
h1{font-size:clamp(32px,8vw,55px);color:#f3caff;text-shadow:0 0 22px #b84dff;margin:12px 0}
p{color:#e3d6ff}
button{background:#702bb4;color:white;border:1px solid #d5a1ff;border-radius:13px;padding:13px 18px;font-size:17px;font-weight:bold;margin:6px;cursor:pointer}
button:active{transform:scale(.97)}
.panel{max-width:620px;margin:12px auto;padding:20px;border:1px solid #68418d;border-radius:20px;background:#170e2be8}
#game{display:none}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:17px;margin:12px}
.stat{background:#281440;padding:10px 14px;border-radius:12px}
canvas{display:block;width:100%;height:min(56vh,480px);min-height:300px;border:1px solid #68418d;border-radius:16px;touch-action:manipulation;background:#090419}
.small{font-size:13px;color:#c7b4e7}
select,input{padding:10px;border-radius:9px;background:#211333;color:white;border:1px solid #9871bc}
/* Star Chaser: animated nebula upgrade */
body {
  background:
    radial-gradient(ellipse at 20% 25%, #7136a8aa, transparent 45%),
    radial-gradient(ellipse at 80% 65%, #2454a8aa, transparent 45%),
    radial-gradient(ellipse at 50% 50%, #24103f, #070514 85%) !important;
  background-size: 180% 180%;
  animation: nebulaPulse 12s ease-in-out infinite alternate;
}

@keyframes nebulaPulse {
  0% {
    background-position: 0% 20%;
    filter: brightness(0.9);
  }
  100% {
    background-position: 100% 80%;
    filter: brightness(1.2);
  }
}

</style>
</head>
<body>
  
<div id="loginScreen">
<h1>⭐ Star Chaser ⭐</h1>
<input id="usernameInput" placeholder="Choose your username" maxlength="20">
<button onclick="login()">Play Star Chaser!</button>
<p id="loginMessage"></p>
</div>
<header>
<h1>⭐ STAR CHASER ⭐</h1>
<p>Catch the falling stars. Build your galaxy!</p>
</header>

<section id="menu" class="panel">
<h2>Main Menu</h2>
<p>Choose your challenge, Star Chaser!</p>
<div>
<button onclick="start('Easy')">🌟 Easy</button>
<button onclick="start('Normal')">✨ Normal</button>
<button onclick="start('Hard')">💫 Hard</button>
<button onclick="start('Impossible')">🔥 Impossible</button>
<button onclick="start('Survival')">♾️ Survival</button>
  <button onclick="scOpenLevelEditor()">🛠️ Level Creator</button>
</div>
<p id="best">Best score: 0</p>
<p id="wallet">🪙 Coins: 0</p>
<button onclick="shop()">🛍️ Star Shop</button>
<button onclick="leaderboard()">🏆 Leaderboard</button>
<button onclick="settings()">⚙️ Settings</button>
</section>

<section id="game" class="panel">
<h2 id="mode">Normal</h2>
<div class="stats">
<div class="stat">⭐ Score: <span id="score">0</span></div>
<div class="stat">🪙 Coins: <span id="coins">0</span></div>
<div class="stat">🔥 Combo: <span id="combo">0</span></div>
<div class="stat" id="goal">Goal: 0</div>
</div>
<canvas id="field"></canvas>
<p>Tap the glowing falling stars to catch them!</p>
<button onclick="pauseGame()">⏸ Pause</button>
<button onclick="backMenu()">⬅ Main Menu</button>
</section>

<section id="info" class="panel" style="display:none">
<h2 id="infoTitle"></h2>
<div id="infoText"></div>
<button onclick="closeInfo()">⬅ Back</button>
</section>

<script>
const $=id=>document.getElementById(id);
const goals={Easy:250,Normal:500,Hard:750,Impossible:2500,Survival:Infinity};
let data;
try{data=JSON.parse(localStorage.getItem('starChaserSave')||'{}')}catch(e){data={}}
data.coins=data.coins||0;
data.best=data.best||0;
data.caught=data.caught||0;
data.bg=data.bg||'galaxy';
data.speed=data.speed||1;
function save(){localStorage.setItem('starChaserSave',JSON.stringify(data));updateWallet()}
function updateWallet(){$('wallet').textContent='🪙 Coins: '+data.coins;$('coins').textContent=data.coins;$('best').textContent='Best score: '+data.best}
let canvas=$('field'),ctx=canvas.getContext('2d');
let running=false,paused=false,mode='Normal',score=0,combo=0,stars=[],particles=[],last=0,spawn=0,raf=0;
let width=600,height=400,frame=0;
function resize(){
 const r=canvas.getBoundingClientRect();
 const dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.max(1,r.width*dpr);canvas.height=Math.max(1,r.height*dpr);
 width=r.width;height=r.height;ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize);
function start(m){
 mode=m;score=0;combo=0;stars=[];particles=[];spawn=0;frame=0;
 $('menu').style.display='none';$('info').style.display='none';$('game').style.display='block';
 $('mode').textContent='Mode: '+mode;$('goal').textContent=goals[m]===Infinity?'Goal: Endless':'Goal: '+goals[m];
 resize();running=true;paused=false;last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
function spawnStar(){
 const golden=Math.random()<.09;
 const size=golden?21:16;
 stars.push({x:size+Math.random()*(Math.max(1,width-size*2)),y:-size,size,
 speed:(.75+Math.random()*1.1)*data.speed*({Easy:.7,Normal:1,Hard:1.4,Impossible:2.3,Survival:1}[mode]||1),
 golden,phase:Math.random()*6.28});
}
function loop(t){
 raf=requestAnimationFrame(loop);
 if(!running||paused)return;
 let dt=Math.min((t-last)/16.67,2);last=t;frame+=dt;spawn+=dt;
 const interval=mode==='Easy'?65:mode==='Normal'?49:mode==='Hard'?34:mode==='Impossible'?20:35;
 if(spawn>interval){spawn=0;spawnStar();if(mode==='Impossible'&&Math.random()<.4)spawnStar()}
 ctx.clearRect(0,0,width,height);
 for(let i=0;i<55;i++){
  const x=(i*97+frame*.1)%width,y=(i*61+frame*.25)%height;
  ctx.fillStyle='rgba(218,190,255,.45)';ctx.fillRect(x,y,2,2);
 }
 for(let i=stars.length-1;i>=0;i--){
  const s=stars[i];s.y+=s.speed*dt;s.phase+=.08*dt;
  ctx.save();ctx.translate(s.x,s.y);ctx.rotate(Math.sin(s.phase)*.13);
  ctx.shadowBlur=s.golden?28:17;ctx.shadowColor=s.golden?'#ffd34f':'#c88aff';
  ctx.fillStyle=s.golden?'#ffe36a':'#f1dfff';
  ctx.font=`${s.size*2}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(s.golden?'🌟':'⭐',0,0);ctx.restore();
  if(s.y>height+30){stars.splice(i,1);combo=0;$('combo').textContent=combo;
   if(mode!=='Survival'&&score>0)score=Math.max(0,score-3);
  }
 }
 for(let i=particles.length-1;i>=0;i--){
  let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
  ctx.globalAlpha=Math.max(0,p.life/24);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4);
  if(p.life<=0)particles.splice(i,1);
 }
 ctx.globalAlpha=1;
 $('score').textContent=score;$('combo').textContent=combo;$('coins').textContent=data.coins;
 if(score>=goals[mode])finish();
}
function catchAt(x,y){
 if(!running||paused)return;
 let hit=-1,dist=Infinity;
 for(let i=0;i<stars.length;i++){
  const s=stars[i],d=Math.hypot(s.x-x,s.y-y);
  if(d<s.size+28&&d<dist){hit=i;dist=d}
 }
 if(hit<0)return;
 const s=stars.splice(hit,1)[0];combo++;
 let earned=(s.golden?5:1)+(combo>=10?2:combo>=5?1:0);
 score+=s.golden?5:1;data.coins+=earned;data.caught++;data.best=Math.max(data.best,score);
 for(let i=0;i<12;i++)particles.push({x:s.x,y:s.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:24,color:s.golden?'#ffd34f':'#e4aaff'});
 save();$('score').textContent=score;$('combo').textContent=combo;
}
canvas.addEventListener('pointerdown',e=>{
 const r=canvas.getBoundingClientRect();catchAt(e.clientX-r.left,e.clientY-r.top);
});
function pauseGame(){paused=!paused;if(!paused)last=performance.now();$('mode').textContent=paused?'Paused':'Mode: '+mode}
function finish(){
 running=false;cancelAnimationFrame(raf);
 data.best=Math.max(data.best,score);save();
 showInfo('🎉 Challenge complete!','You caught '+score+' stars and earned coins. Your best score is '+data.best+'.');
}
function backMenu(){running=false;cancelAnimationFrame(raf);$('game').style.display='none';$('info').style.display='none';$('menu').style.display='block';updateWallet()}
function showInfo(title,html){$('game').style.display='none';$('menu').style.display='none';$('info').style.display='block';$('infoTitle').textContent=title;$('infoText').innerHTML=html}
function closeInfo(){ $('info').style.display='none';$('menu').style.display='block';updateWallet()}
function shop(){
 showInfo('🛍️ Star Shop',`<p>You have <b>${data.coins}</b> coins.</p>
 <button onclick="buyBg('ocean',100)">🌊 Star Ocean · 100</button>
 <button onclick="buyBg('pink',250)">💗 Pink Nebula · 250</button>
 <button onclick="buyBg('emerald',500)">💚 Emerald Galaxy · 500</button>
 <button onclick="buyBg('sunset',1000)">🌅 Cosmic Sunset · 1,000</button>
 <button onclick="buyUpgrade()">✨ Speed boost · 200</button>
 <p class="small">Purchases are saved on this device.</p>`);
}
function buyBg(bg,cost){if(data.coins<cost){alert('Not enough coins yet!');return}data.coins-=cost;data.bg=bg;save();alert('Background unlocked!');shop()}
function buyUpgrade(){if(data.coins<200){alert('Not enough coins yet!');return}data.coins-=200;data.speed=Math.min(2.5,data.speed+.2);save();alert('Star speed upgraded!');shop()}
function leaderboard(){
 const board=JSON.parse(localStorage.getItem('starChaserScores')||'[]');
 board.push({name:'You',score:data.best});board.sort((a,b)=>b.score-a.score);
 showInfo('🏆 Leaderboard','<p>Your best score: '+data.best+'</p><ol>'+board.slice(0,10).map(x=>'<li>'+escapeText(x.name)+': '+x.score+'</li>').join('')+'</ol><p class="small">Scores are saved on this device. Online rankings need a shared server.</p>');
 localStorage.setItem('starChaserScores',JSON.stringify(board.slice(0,10)));
}
function escapeText(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function settings(){
 showInfo('⚙️ Settings',`<p>Star speed: ${data.speed.toFixed(1)}x</p>
 <button onclick="setSpeed(0.7)">🐢 Slower</button>
 <button onclick="setSpeed(1)">⭐ Normal speed</button>
 <button onclick="setSpeed(1.5)">⚡ Faster</button>
 <p class="small">Your coins and best score save automatically on this device.</p>`);
}
function setSpeed(v){data.speed=v;save();settings()}
updateWallet();
// STAR CHASER LEVEL SYSTEM
const SC_LEVEL_KEY = "starChaserLevel";
let scLevel = Number(localStorage.getItem(SC_LEVEL_KEY)) || 1;

function scGetWorld(level) {
  if (level >= 100) return 5;
  if (level >= 50) return 4;
  if (level >= 25) return 3;
  if (level >= 10) return 2;
  return 1;
}

function scSaveLevel(level) {
  scLevel = Math.max(1, Math.min(150, level));
  localStorage.setItem(SC_LEVEL_KEY, scLevel);

  const world = scGetWorld(scLevel);
  localStorage.setItem("starChaserWorld", world);

  return { level: scLevel, world: world };
}

function scAddRating(rating) {
  const gained = Math.max(0, Math.floor(rating));
  const total =
    Number(localStorage.getItem("starChaserRatings") || 0) + gained;

  localStorage.setItem("starChaserRatings", total);

  const newLevel = Math.min(150, 1 + Math.floor(total / 100));
  const oldLevel = scLevel;

  scSaveLevel(newLevel);

  if (newLevel > oldLevel) {
    alert("⭐ LEVEL UP! You reached Level " + newLevel + "!");
  }

  if (newLevel === 150 && oldLevel < 150) {
    alert("🏆 ULTIMATE VICTORY! You conquered Star Chaser!");
  }
}
  function scOpenLevelEditor() {
  const templates = [
    ["Nebula World", "💜", "Purple clouds and glowing stars"],
    ["Solar World", "☀️", "Golden light and solar flares"],
    ["Frozen World", "❄️", "Icy blue space"],
    ["Emerald World", "💚", "Green cosmic clouds"],
    ["Black Hole World", "🕳️", "Dark space and a glowing vortex"],
    ["Rainbow Galaxy", "🌈", "Colorful cosmic effects"],
    ["Banana Galaxy", "🍌", "A silly yellow star universe"],
    ["Crystal Planet", "💎", "Shimmering crystal stars"],
    ["Create from Scratch", "➕", "Build your own world"]
  ];

  let screen = document.getElementById("scCreatorScreen");

  if (!screen) {
    screen = document.createElement("div");
    screen.id = "scCreatorScreen";
    screen.style.cssText =
      "position:fixed;inset:0;z-index:99999;background:#100824;color:white;padding:18px;overflow:auto;font-family:Arial,sans-serif";
    document.body.appendChild(screen);
  }

  function showTemplates() {
    screen.innerHTML = `
      <h1>🌌 Choose a Template</h1>
      <div id="scTemplateGrid" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px"></div>
      <button id="scCreatorExit">Exit</button>
    `;

    const grid = screen.querySelector("#scTemplateGrid");

    templates.forEach(([name, icon, description]) => {
      const button = document.createElement("button");
      button.style.cssText =
        "padding:16px 8px;border-radius:12px;background:#302052;color:white;border:1px solid #9b78df";
      button.innerHTML =
        `<div style="font-size:28px">${icon}</div><b>${name}</b><p>${description}</p>`;
      button.onclick = () => confirmTemplate(name);
      grid.appendChild(button);
    });

    screen.querySelector("#scCreatorExit").onclick = scExitLevelEditor;
  }

  function confirmTemplate(name) {
    screen.innerHTML = `
      <h2>Use ${name}?</h2>
      <p>Are you sure you want to choose this template?</p>
      <button id="scTemplateYes">Yes</button>
      <button id="scTemplateNo">No</button>
    `;

    screen.querySelector("#scTemplateYes").onclick = () => {
      localStorage.setItem("scSelectedTemplate", name);
      showEditor(name);
    };

    screen.querySelector("#scTemplateNo").onclick = showTemplates;
  }

  function showEditor(name) {
    screen.innerHTML = `
      <h1>⭐ Level Editor</h1>
      <h2>${name}</h2>
      <label>Level name</label>
      <input id="scLevelName" value="My Cosmic Level" maxlength="40">
      <p>⭐ Selected template: ${name}</p>
      <button id="scSave">💾 Save</button>
      <button id="scTest">▶ Save & Test</button>
      <button id="scRename">✏️ Rename</button>
      <button id="scBack">Back to Templates</button>
      <button id="scExit">Exit</button>
      <p id="scMessage"></p>
    `;

    screen.querySelector("#scSave").onclick = () => {
      const level = {
        name: screen.querySelector("#scLevelName").value.trim() || "My Cosmic Level",
        world: name
      };
      const levels = JSON.parse(localStorage.getItem("scCustomLevels") || "[]");
      const index = levels.findIndex(item => item.name === level.name);
      if (index >= 0) levels[index] = level;
      else levels.push(level);
      localStorage.setItem("scCustomLevels", JSON.stringify(levels));
      screen.querySelector("#scMessage").textContent = "⭐ Level saved!";
    };

    screen.querySelector("#scTest").onclick = () => {
      screen.querySelector("#scSave").click();
      screen.querySelector("#scMessage").textContent =
        "Saved! Connecting playable testing comes next.";
    };

    screen.querySelector("#scRename").onclick = () => {
      screen.querySelector("#scLevelName").focus();
      screen.querySelector("#scLevelName").select();
    };

    screen.querySelector("#scBack").onclick = showTemplates;
    screen.querySelector("#scExit").onclick = scExitLevelEditor;
  }

  showTemplates();
}
function scChooseTemplate(name) {
  if (!confirm("Are you sure you want to choose " + name + "?")) {
    return;
  }

  const screen = document.getElementById("scCreatorScreen");
  const stars = [];

  screen.innerHTML = `
    <h1>⭐ Level Editor</h1>
    <p>Template: ${name}</p>
    <input id="scLevelName" value="My Cosmic Level"
      placeholder="Level name">

    <div id="scWorkspace"
      style="position:relative;height:350px;background:#100824;
      border:2px solid #a78bfa;border-radius:12px;overflow:hidden;
      margin:12px 0;touch-action:manipulation">
    </div>

    <button id="scAddStar">⭐ Add Star</button>
    <button id="scGoldStar">🌟 Add Gold Star</button>
    <button id="scRemoveStar">🗑️ Remove Selected</button>
    <button id="scSaveLevel">💾 Save</button>
    <button id="scTestLevel">▶ Save & Test</button>
    <button onclick="scOpenLevelEditor()">Back to Templates</button>
    <button onclick="scExitLevelEditor()">Exit</button>
    <p id="scEditorMessage">Tap a star to select it.</p>
  `;

  const workspace = screen.querySelector("#scWorkspace");
  let selectedStar = null;

  function addStar(gold = false) {
    const star = document.createElement("button");
    star.textContent = gold ? "🌟" : "⭐";
    star.style.cssText =
      "position:absolute;left:45%;top:40%;font-size:30px;" +
      "background:transparent;border:0;padding:4px;touch-action:manipulation";
    star.dataset.gold = String(gold);
    workspace.appendChild(star);
    stars.push(star);
    selectStar(star);
  }

  function selectStar(star) {
    selectedStar = star;
    screen.querySelector("#scEditorMessage").textContent =
      "Selected " + star.textContent +
      ". Use the arrow buttons to move it.";
  }

  workspace.addEventListener("click", event => {
    if (event.target.tagName === "BUTTON") {
      selectStar(event.target);
    }
  });

  screen.querySelector("#scAddStar").onclick = () => addStar();
  screen.querySelector("#scGoldStar").onclick = () => addStar(true);

  screen.querySelector("#scRemoveStar").onclick = () => {
    if (!selectedStar) return;
    const index = stars.indexOf(selectedStar);
    if (index >= 0) stars.splice(index, 1);
    selectedStar.remove();
    selectedStar = null;
  };

  ["⬅️", "⬆️", "⬇️", "➡️"].forEach((arrow, index) => {
    const button = document.createElement("button");
    button.textContent = arrow;
    button.onclick = () => {
      if (!selectedStar) return;
      const directions = [
        [-5, 0], [0, -5], [0, 5], [5, 0]
      ];
      const [dx, dy] = directions[index];
      const x = parseFloat(selectedStar.style.left) || 0;
      const y = parseFloat(selectedStar.style.top) || 0;
      selectedStar.style.left = Math.max(0, Math.min(90, x + dx)) + "%";
      selectedStar.style.top = Math.max(0, Math.min(85, y + dy)) + "%";
    };
    workspace.after(button);
  });

  screen.querySelector("#scSaveLevel").onclick = saveLevel;

  function saveLevel() {
    const level = {
      name: screen.querySelector("#scLevelName").value.trim()
        || "My Cosmic Level",
      world: name,
      stars: stars.map(star => ({
        x: parseFloat(star.style.left) || 0,
        y: parseFloat(star.style.top) || 0,
        gold: star.dataset.gold === "true"
      }))
    };

    const levels = JSON.parse(
      localStorage.getItem("scCustomLevels") || "[]"
    );
    const index = levels.findIndex(item => item.name === level.name);
    if (index >= 0) levels[index] = level;
    else levels.push(level);

    localStorage.setItem("scCustomLevels", JSON.stringify(levels));
    screen.querySelector("#scEditorMessage").textContent = "⭐ Level saved!";
  }

  screen.querySelector("#scTestLevel").onclick = () => {
    saveLevel();
    screen.querySelector("#scEditorMessage").textContent =
      "Level saved. Connecting it to playable gameplay is the next step.";
  };
}
  const screen = document.getElementById("scCreatorScreen");
  if (screen) {
    screen.remove();
  }
  const editor = document.createElement("div");
  editor.id = "scCreatorScreen";
  editor.style.cssText = "position:fixed;inset:0;z-index:99999;background:#100824;color:white;padding:20px;overflow:auto";
  editor.innerHTML = "<h1>🌌 Choose a Template</h1><button onclick=\"scChooseTemplate('Nebula World')\">💜 Nebula World</button><button onclick=\"scChooseTemplate('Solar World')\">☀️ Solar World</button><button onclick=\"scChooseTemplate('Frozen World')\">❄️ Frozen World</button>";
  document.body.appendChild(editor);
}


function scChooseTemplate(name) {
  if (!confirm("Are you sure you want to choose " + name + "?")) {
    return;
  }

  const screen = document.getElementById("scCreatorScreen");
  let stars = [];
  let selected = null;
  let length = 30;
  let song = "No song selected";
  let sfx = "Default SFX";

  screen.innerHTML = `
    <style>
      #scCreatorScreen .sc-workspace {

    </style>

    <div class="sc-top">

    </div>

    <h1 style="text-align:center">⭐ Level Editor</h1>
    <p class="sc-label">Template: ${name}</p>
    <input id="scName" value="My Cosmic Level"
      maxlength="40" aria-label="Level name"
      style="font-size:18px;max-width:100%;box-sizing:border-box">

    <div id="scWorkspace" class="sc-workspace"></div>

    <p id="scSelected" class="sc-label">
      Select a star to edit it
    </p>

    <div class="sc-tools">
      <button id="scRotate">⟳ Rotate</button>
      <button id="scResize">↔ Resize</button>
      <button id="scGold">💰 Turn to Gold Star</button>
    </div>

    <div class="sc-tools" style="margin-top:14px">
      <button id="scAdd">Add star</button>
      <button id="scRemove">Remove star</button>
      <button id="scLength">Length: 30s</button>
    </div>

    <div class="sc-tools" style="margin-top:14px">
      <button id="scSave">Save</button>
      <button id="scTest">Save & Test</button>
      <button id="scBack">Templates</button>
    </div>
    <p id="scMessage" class="sc-label"></p>
  `;

  const workspace = screen.querySelector("#scWorkspace");
  const message = screen.querySelector("#scMessage");

  function selectStar(star) {
    selected = star;
    screen.querySelector("#scSelected").textContent =
      "Selected star · Drag it to move";
    stars.forEach(s => {
      s.style.outline = s === star ? "3px dashed #0755ff" : "none";
    });
  }

  function addStar(gold = false) {
    const star = document.createElement("button");
    star.className = "sc-star";
    star.textContent = "★";
    star.dataset.gold = String(gold);
    star.style.left = "calc(50% - 55px)";
    star.style.top = "calc(50% - 55px)";
    star.style.color = gold ? "#ffbd00" : "#c6ff00";
    star.style.transform = "rotate(0deg) scale(1)";
    workspace.appendChild(star);

    const item = {
      element: star, x: 50, y: 50, angle: 0, scale: 1, gold
    };
    stars.push(item);

    star.addEventListener("click", event => {
      event.stopPropagation();
      selectStar(item);
    });

    let dragging = false;
    star.addEventListener("pointerdown", event => {
      if (event.target !== star) return;
      dragging = true;
      star.setPointerCapture(event.pointerId);
      selectStar(item);
    });
    star.addEventListener("pointermove", event => {
      if (!dragging) return;
      const rect = workspace.getBoundingClientRect();
      item.x = Math.max(5, Math.min(95,
        (event.clientX - rect.left) / rect.width * 100));
      item.y = Math.max(5, Math.min(95,
        (event.clientY - rect.top) / rect.height * 100));
      star.style.left = item.x + "%";
      star.style.top = item.y + "%";
    });
    star.addEventListener("pointerup", () => dragging = false);
    star.addEventListener("pointercancel", () => dragging = false);

    selectStar(item);
  }

  screen.querySelector("#scAdd").onclick = () => addStar();

  screen.querySelector("#scRemove").onclick = () => {
    if (!selected) {
      message.textContent = "Select a star first!";
      return;
    }
    selected.element.remove();
    stars = stars.filter(s => s !== selected);
    selected = null;
    screen.querySelector("#scSelected").textContent =
      "Select a star to edit it";
  };

  screen.querySelector("#scRotate").onclick = () => {
    if (!selected) return;
    selected.angle = (selected.angle + 45) % 360;
    selected.element.style.transform =
      `rotate(${selected.angle}deg) scale(${selected.scale})`;
  };

  screen.querySelector("#scResize").onclick = () => {
    if (!selected) return;
    selected.scale = selected.scale >= 1.8 ? 0.6 : selected.scale + 0.3;
    selected.element.style.transform =
      `rotate(${selected.angle}deg) scale(${selected.scale})`;
  };

  screen.querySelector("#scGold").onclick = () => {
    if (!selected) return;
    selected.gold = !selected.gold;
    selected.element.dataset.gold = String(selected.gold);
    selected.element.style.color = selected.gold ? "#ffbd00" : "#c6ff00";
  };

  screen.querySelector("#scLength").onclick = () => {
    length = length >= 120 ? 15 : length + 15;
    screen.querySelector("#scLength").textContent =
      "Length: " + length + "s";
  };

  screen.querySelector("#scSfx").onclick = () => {
    sfx = prompt("Enter an SFX name:", sfx) || sfx;
    message.textContent = "SFX: " + sfx;
  };

  screen.querySelector("#scSong").onclick = () => {
    song = prompt("Enter a song name:", song) || song;
    message.textContent = "Song: " + song;
  };

  function saveLevel() {
    const level = {
      name: screen.querySelector("#scName").value.trim()
        || "My Cosmic Level",
      world: name,
      length,
      song,
      sfx,
      stars: stars.map(s => ({
        x: s.x, y: s.y, gold: s.gold,
        angle: s.angle, scale: s.scale
      }))
    };

    const levels = JSON.parse(
      localStorage.getItem("scCustomLevels") || "[]"
    );
    const index = levels.findIndex(item => item.name === level.name);
    if (index >= 0) levels[index] = level;
    else levels.push(level);

    localStorage.setItem("scCustomLevels", JSON.stringify(levels));
    message.textContent = "⭐ Level saved!";
  }

  screen.querySelector("#scSave").onclick = saveLevel;

  screen.querySelector("#scTest").onclick = () => {
    saveLevel();
    message.textContent =
      "Saved! Actual gameplay testing still needs to be connected.";
  };

  screen.querySelector("#scBack").onclick = scOpenLevelEditor;
  screen.querySelector("#scClose").onclick = scExitLevelEditor;

  addStar();
}
  
function scExitLevelEditor() {
  const screen = document.getElementById("scCreatorScreen");
  if (screen) screen.remove();
}
</script>
</body>
</html>
